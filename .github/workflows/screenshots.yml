name: Screenshots

# Builds the app for the iOS Simulator, runs it in demo mode (sample data) and saves screenshots
# of every screen as an artifact. Start by hand: Actions → Screenshots → Run workflow.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages, space-separated (uk ru en)"
        default: "uk ru"

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate project and build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build shots
          DEVICE_ID=$(bash scripts/pick-simulator.sh)
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project CarCareLog.xcodeproj -scheme CarCareLog \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > build/build.log 2>&1 || { tail -60 build/build.log; exit 1; }

      - name: Take screenshots
        run: bash scripts/take-screenshots.sh "${{ inputs.languages }}"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14
